<!DOCTYPE html>
<html lang="ml"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ശാസ്ത്രോത്സവം Winner Poster Maker</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Noto+Sans+Malayalam:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Manrope,'Noto Sans Malayalam',sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#0a0a6e;color:#fff;padding:14px 18px;font-weight:800}
main{max-width:1100px;margin:auto;padding:16px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
@media(max-width:820px){main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px #0002}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 4px}
input[type=text],select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;font-size:14px}
input[type=range]{width:100%}
canvas{width:100%;height:auto;border-radius:10px;display:block}
button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:#059669;color:#fff;font:800 17px inherit;font-family:inherit;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.row label{font-weight:600;font-size:12px}
</style></head><body>
<header>ശാസ്ത്രോത്സവം 2026 · Winner Poster Maker · GHSS കാരക്കുന്ന്</header>
<main>
<section class="card">
<label>Student Photo / ഫോട്ടോ</label><input type="file" id="photo" accept="image/*">
<div class="row"><div><label>Zoom</label><input type="range" id="zoom" min="0.5" max="3" step="0.05" value="1"></div>
<div><label>Left / Right</label><input type="range" id="ox" min="-200" max="200" value="0"></div>
<div><label>Up / Down</label><input type="range" id="oy" min="-200" max="200" value="0"></div></div>
<label>Student Name</label><input type="text" id="name" value="ARSHAD KARAKUNNU" placeholder="E.g. AJMAL T P">
<label>Fair / മേള</label><select id="fair"><option>SCIENCE FAIR</option><option>MATHEMATICS FAIR</option><option>IT FAIR</option><option>WORK EXPERIENCE FAIR</option><option>SOCIAL SCIENCE FAIR</option></select>
<label>Category / വിഭാഗം</label><select id="cat"><option>LP SECTION</option><option>UP SECTION</option><option selected>HIGH SCHOOL (HS)</option><option>HIGHER SECONDARY (HSS)</option></select>
<label>Item / ഇനം</label><input type="text" id="item" value="STILL MODEL">
<label>Result / ഫലം</label><select id="result"><option>FIRST WITH A GRADE</option><option>SECOND WITH A GRADE</option><option>THIRD WITH A GRADE</option><option>FIRST PLACE</option><option>SECOND PLACE</option><option>THIRD PLACE</option><option>A GRADE</option><option>B GRADE</option></select>
<label>School / സ്കൂൾ</label><input type="text" id="school" value="GHSS KARAKUNNU">
</section>
<section class="card"><canvas id="c" width="1080" height="1350"></canvas>
<button id="dl">⬇ Download Poster (PNG)</button></section>

const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);
const frame=new Image(),photo=new Image();let hasPhoto=false;
// photo box (inside the blue border of your poster)
const PX=324,PY=342,PW=364,PH=458;
function rr(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,h,r)}
function fit(t,maxW,size,min,w){size=size;do{x.font=`${w} ${size}px Manrope,'Noto Sans Malayalam',sans-serif`;if(x.measureText(t).width<=maxW||size<=min)break;size-=2}while(1);return size}
function lines(t,maxW,size){x.font=`800 ${size}px Manrope,sans-serif`;const out=[];let cur='';t.split(' ').forEach(w=>{const n=cur?cur+' '+w:w;if(x.measureText(n).width>maxW&&cur){out.push(cur);cur=w}else cur=n});out.push(cur);return out}
function draw(){
 x.clearRect(0,0,1080,1350);x.drawImage(frame,0,0,1080,1350);
 if(hasPhoto){x.save();x.beginPath();x.rect(PX,PY,PW,PH);x.clip();
  const z=+$('zoom').value,s=Math.max(PW/photo.width,PH/photo.height)*z,w=photo.width*s,h=photo.height*s;
  x.drawImage(photo,PX+(PW-w)/2+ +$('ox').value,PY+(PH-h)/2+ +$('oy').value,w,h);x.restore();
  x.strokeStyle='#2e2e9a';x.lineWidth=5;x.strokeRect(PX-2,PY-2,PW+4,PH+4)}
 else{x.fillStyle='#94a3b8';x.font='800 28px Manrope,sans-serif';x.textAlign='center';x.fillText('Upload photo',PX+PW/2,PY+PH/2)}
 x.textAlign='center';x.textBaseline='middle';
 // right info card
 const cx=872,cw=330;
 x.fillStyle='rgba(255,255,255,.82)';rr(cx-cw/2,338,cw,466,22);x.fill();
 x.strokeStyle='#2e2e9a';x.lineWidth=3;x.stroke();
 let size=46,L;do{L=lines($('name').value.trim().toUpperCase()||'NAME',cw-40,size);if(L.length<=3)break;size-=3}while(size>22);
 x.fillStyle='#0a0a6e';x.font=`800 ${size}px Manrope,sans-serif`;
 const lh=size*1.2;let y=420-(L.length-1)*lh/2;L.forEach((l,i)=>x.fillText(l,cx,y+i*lh));
 x.strokeStyle='#cbd5e1';x.lineWidth=2;x.beginPath();x.moveTo(cx-120,540);x.lineTo(cx+120,540);x.stroke();
 x.fillStyle='#b45309';fit($('fair').value,cw-40,28,16,800);x.fillText($('fair').value,cx,590);
 x.fillStyle='#334155';fit($('cat').value,cw-40,26,14,800);x.fillText($('cat').value,cx,640);
 const it=$('item').value.trim().toUpperCase()||'ITEM';
 x.fillStyle='#0f172a';size=fit(it,cw-40,34,16,800);x.fillText(it,cx,715);
 // result badge
 const bx=715,by=860,bw=640,bh=84,g=x.createLinearGradient(bx-bw/2,0,bx+bw/2,0);
 g.addColorStop(0,'#14532d');g.addColorStop(.5,'#22c55e');g.addColorStop(1,'#14532d');
 x.fillStyle=g;rr(bx-bw/2,by-bh/2,bw,bh,18);x.fill();x.strokeStyle='#fde047';x.lineWidth=4;x.stroke();
 x.fillStyle='#fff';fit($('result').value,bw-40,40,20,800);x.fillText($('result').value,bx,by+2);
 // school
 const sc=$('school').value.trim().toUpperCase()||'SCHOOL';
 x.fillStyle='#0a0a6e';fit(sc,560,40,18,800);x.fillText(sc,bx+30,985);
}
['name','fair','cat','item','result','school','zoom','ox','oy'].forEach(i=>{$(i).addEventListener('input',draw);$(i).addEventListener('change',draw)});
$('photo').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{photo.onload=()=>{hasPhoto=true;$('zoom').value=1;$('ox').value=0;$('oy').value=0;draw()};photo.src=ev.target.result};r.readAsDataURL(f)});
$('dl').onclick=()=>{draw();const a=document.createElement('a');a.download='Poster_'+($('name').value.trim().replace(/\s+/g,'_')||'Winner')+'.png';a.href=c.toDataURL('image/png');a.click()};
frame.onload=draw;frame.src=FRAME_SRC;
if(document.fonts)document.fonts.ready.then(draw);
